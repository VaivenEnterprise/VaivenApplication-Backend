      description: |
        Devuelve días, tarifa, total, desglose de pagos (POL-05) y los textos de
        política (POL-03, POL-09) **antes** de solicitar. No crea nada (RF-01).

        - `days = (endDate − startDate) + 1`, de 1 a 7 (POL-02); `startDate` no puede
          ser anterior a hoy en Ciudad de México.
        - Préstamo: total 0 y `paymentMode=none`. Renta: `full_on_delivery` o
          `split_50_50` (entrega `ceil(total/2)`, devolución `floor(total/2)`).
        - El objeto debe estar `active` y no ser de quien cotiza.
