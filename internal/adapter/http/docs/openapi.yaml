  /api/v1/bookings/{id}/ratings:
    post:
      tags:
        - calificaciones
      operationId: rateBooking
      summary: Calificar a la otra parte de una reserva
      description: |
        Guarda la calificación y actualiza de forma atómica el promedio y la
        cantidad del perfil de la persona calificada (RF-01, RF-02).

        - La reserva debe estar `completed` (si no, 409) y la ventana de 14 días
          desde que se completó no debe haber vencido (si no, 409).
        - Quien no es parte de la reserva recibe 404.
        - Una segunda calificación propia a la misma reserva responde 409, también
          si llegan dos iguales a la vez: solo una se guarda (RNF-01).
        - `score` es un entero de 1 a 5; `comment` es opcional (hasta 300
          caracteres; vacío = sin comentario).
        - Avisa a la persona calificada (RF-10, evento `rating.received`).
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/BookingIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateRequest'
            example:
              score: 5
              comment: Todo salió muy bien, llegó puntual.
      responses:
        '201':
          description: La calificación guardada.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
              example:
                id: 6731b0000000000000000010
                bookingId: 6731a0000000000000000001
                score: 5
                comment: Todo salió muy bien, llegó puntual.
                ratedRole: owner
                rater:
                  id: 6730f1c2a9b3e4d5f6a7b8c9
                  displayName: Ana
                createdAt: '2026-11-21T16:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/bookings/{id}/rating-status:
    get:
      tags:
        - calificaciones
      operationId: getRatingStatus
      summary: Si puedo calificar esta reserva
      description: |
        `canRate` es verdadero si la reserva está `completed`, soy parte, aún no la
        calificé y estoy dentro de la ventana de 14 días (RF-03). `myRating` es mi
        calificación o `null`; `expiresAt` es cuándo vence la ventana (`null` si la
        reserva aún no se completó). Quien no es parte recibe 404.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/BookingIdPath'
      responses:
        '200':
          description: Estado de mi calificación.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingStatus'
              example:
                canRate: true
                myRating: null
                expiresAt: '2026-12-05T16:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{id}/ratings:
    get:
      tags:
        - calificaciones
      operationId: listUserRatings
      summary: Calificaciones recibidas por una persona
      description: |
        Puntaje, comentario, quién califica (nombre visible) y fecha; las más
        recientes primero (RF-04). `nextCursor` null = no hay más. Un usuario que
        no existe responde 404. El promedio y la cantidad están en el perfil público
        (`GET /api/v1/users/{id}`).
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Página de calificaciones.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/bookings/{id}/incidents:
    post:
      tags:
        - incidencias
      operationId: openIncident
      summary: Reportar un incumplimiento de una reserva
      description: |
        Abre una incidencia contra la otra parte (RF-05). Reglas:

        - Solo las partes; quien no lo es recibe 404.
        - La reserva debe estar `accepted`, `in_progress` o `completed` (POL-08: si
          está completada, dentro de las 72 h siguientes). Si no, 409.
        - `no_show` solo si ya llegó la fecha de inicio de la reserva (si no, 409).
        - Máximo 3 incidencias abiertas por reserva; la cuarta responde 409 (CA-08).
        - `description` de 10 a 1000 caracteres; `evidence` de 0 a 5 imágenes con
          propósito `evidence` subidas por quien reporta.
        - La reserva no cambia de estado (CA-04). Avisa a la parte reportada
          (evento `incident.opened`).
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/BookingIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentInput'
            example:
              reason: damaged
              description: El objeto regresó con la tapa rota y no estaba así en la entrega.
              evidence:
                - publicId: vaiven/staging/evidence/6730f1c2a9b3e4d5f6a7b8c9/abc123
      responses:
        '201':
          description: La incidencia abierta.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/incidents/{id}:
    get:
      tags:
        - incidencias
      operationId: getIncident
      summary: Ver una incidencia
      description: |
        Disponible para las dos partes y para el administrador (RF-07); cualquier
        otra persona recibe 404. Las partes ven solo las notas con
        `visibleToParties` verdadero (sin el campo) y la respuesta final; el
        administrador ve todas las notas con su `visibleToParties`. La evidencia
        trae URL firmadas de 10 minutos.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IncidentIdPath'
      responses:
        '200':
          description: La incidencia.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me/incidents:
    get:
      tags:
        - incidencias
      operationId: listMyIncidents
      summary: Mis incidencias
      description: |
        Las incidencias en las que soy la parte que reporta o la reportada, las más
        recientes primero (RF-07). `status` filtra por `open` o `closed`; sin él se
        listan todas. `nextCursor` null = no hay más.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IncidentStatus'
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Página de incidencias.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/incidents:
    get:
      tags:
        - administracion
      operationId: adminListIncidents
      summary: Cola de incidencias (administración)
      description: |
        Lista incidencias para revisarlas (RF-08), las más antiguas primero. `status`
        filtra por `open` o `closed`; sin él se listan las `open`. Cada incidencia
        incluye todas sus notas con `visibleToParties`.
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IncidentStatus'
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Página de incidencias (vista de administración).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/incidents/{id}/notes:
    post:
      tags:
        - administracion
      operationId: adminAddIncidentNote
      summary: Agregar una nota a una incidencia
      description: |
        Agrega una nota (máximo 10 por incidencia; la undécima responde 409). Si
        `visibleToParties` es verdadero, ambas partes la ven y reciben aviso (evento
        `incident.note`); si no, es interna. Una incidencia cerrada no admite notas
        (409).
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IncidentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddIncidentNoteRequest'
            example:
              text: Por favor envía una foto del objeto antes de la entrega.
              visibleToParties: true
      responses:
        '200':
          description: La incidencia con la nota agregada (vista de administración).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/incidents/{id}/close:
    post:
      tags:
        - administracion
      operationId: adminCloseIncident
      summary: Cerrar una incidencia con respuesta final
      description: |
        Pasa la incidencia de `open` a `closed` con una respuesta final
        (`finalResponse`, 5 a 1000 caracteres) y un `outcome` (`none`,
        `monetary_adjustment` o `restriction`), que solo registra la decisión: no
        cobra ni restringe nada por sí mismo (la sanción es aparte). Ambas partes
        ven la respuesta final y reciben aviso (evento `incident.closed`). Cerrar una
        incidencia ya cerrada responde 409.
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IncidentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseIncidentRequest'
            example:
              finalResponse: Revisamos la evidencia y acordamos un ajuste con ambas partes.
              outcome: monetary_adjustment
      responses:
        '200':
          description: La incidencia cerrada (vista de administración).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/users/{id}/sanctions:
    post:
      tags:
        - administracion
      operationId: adminApplySanction
      summary: Registrar una advertencia o suspensión
      description: |
        Registra una sanción a una persona (RF-09). `warning` solo avisa;
        `suspension` exige `endsAt` (futuro) y suspende la cuenta hasta esa fecha:
        mientras dure no puede **crear** objetos ni solicitudes (403), pero sigue
        pudiendo consultar y cerrar lo que ya tiene. Las sanciones no modifican las
        calificaciones. `incidentId` es opcional y debe existir. La persona recibe
        aviso (evento `sanction.applied`). Si ya había una suspensión, la última
        fecha registrada es la que rige.
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SanctionInput'
            example:
              type: suspension
              reason: Daño reiterado a objetos de otras personas.
              endsAt: '2026-12-09T00:00:00Z'
              incidentId: 6731c0000000000000000001
      responses:
        '201':
          description: La sanción registrada.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sanction'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso que entregan login, register y refresh.
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: El mismo token de acceso, de una cuenta con rol `admin` (spec 010, RF-11). Las demás cuentas reciben 403.
  parameters:
    BookingIdPath:
      name: id
      in: path
      required: true
      description: Identificador de la reserva (24 caracteres hexadecimales).
      schema:
        type: string
        pattern: ^[0-9a-f]{24}$
    UserIdPath:
      name: id
      in: path
      required: true
      description: Identificador de la persona (24 caracteres hexadecimales).
      schema:
        type: string
        pattern: ^[0-9a-f]{24}$
    IncidentIdPath:
      name: id
      in: path
      required: true
      description: Identificador de la incidencia (24 caracteres hexadecimales).
      schema:
        type: string
        pattern: ^[0-9a-f]{24}$
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: El `nextCursor` de la página anterior.
      schema:
        type: string
        maxLength: 128
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Tamaño de página.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Identificador de la petición; se reutiliza si es válido.
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9-]{1,64}$
    BookingId:
      name: id
      in: path
      required: true
      description: Identificador de la solicitud o reserva.
      schema:
        type: string
        pattern: ^[0-9a-f]{24}$
    ConversationId:
      name: id
      in: path
      required: true
      description: Identificador de la conversación.
      schema:
        type: string
        pattern: ^[0-9a-f]{24}$
    parameters-BookingId:
      name: id
      in: path
      required: true
      description: Identificador de la reserva.
      schema:
        type: string
        pattern: ^[0-9a-f]{24}$
    PaymentStage:
      name: stage
      in: path
      required: true
      description: Etapa del pago.
      schema:
        $ref: '#/components/schemas/PaymentStage'
  headers:
    X-Request-Id:
      description: Identificador de la petición (el recibido si era válido o uno nuevo).
      schema:
        type: string
        maxLength: 64
  schemas:
    Status:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    Ready:
      type: object
      required:
        - status
        - redis
      properties:
        status:
          type: string
          enum:
            - ready
        redis:
          type: string
          enum:
            - ok
            - degradado
          description: Estado de Redis; degradado si no responde o no está configurado.
    Meta:
      type: object
      required:
        - name
        - version
        - environment
        - serverTime
      properties:
        name:
          type: string
        version:
          type: string
        environment:
          type: string
          enum:
            - development
            - test
            - staging
            - production
        serverTime:
          type: string
          format: date-time
          description: Hora del servidor en UTC (ISO-8601).
    Role:
      type: string
      enum:
        - user
        - admin
    User:
      type: object
      description: La cuenta propia (solo la ve su dueña).
      required:
        - id
        - email
        - displayName
        - phone
        - role
        - ratingAverage
        - ratingCount
        - createdAt
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        phone:
          type:
            - string
            - 'null'
        role:
          $ref: '#/components/schemas/Role'
        ratingAverage:
          type:
            - number
            - 'null'
          description: Promedio de calificaciones (1 a 5); null sin calificaciones (spec 010).
        ratingCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    PublicUser:
      type: object
      description: Perfil público; nunca incluye correo ni teléfono (Art. VI.4).
      required:
        - id
        - displayName
        - ratingAverage
        - ratingCount
        - memberSince
      properties:
        id:
          type: string
        displayName:
          type: string
          description: «Cuenta eliminada» si la cuenta se dio de baja.
        ratingAverage:
          type:
            - number
            - 'null'
        ratingCount:
          type: integer
          minimum: 0
        memberSince:
          type: string
          format: date-time
    Tokens:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
      properties:
        accessToken:
          type: string
          description: 'JWT HS256 para el encabezado `Authorization: Bearer`.'
        refreshToken:
          type: string
          description: Token opaco de un solo uso (30 días); se cambia en cada `refresh`.
        expiresIn:
          type: integer
          description: Segundos de vida del token de acceso (900).
    AuthResult:
      type: object
      required:
        - user
        - tokens
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/Tokens'
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - displayName
        - acceptTerms
        - isAdult
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Se guarda en minúsculas y sin espacios.
        password:
          type: string
          minLength: 8
          maxLength: 72
        displayName:
          type: string
          minLength: 2
          maxLength: 40
        acceptTerms:
          type: boolean
          const: true
          description: Aceptación de términos y privacidad (POL-12).
        isAdult:
          type: boolean
          const: true
          description: Declaración de mayoría de edad (POL-12).
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 72
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          maxLength: 128
    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 40
        phone:
          type:
            - string
            - 'null'
          pattern: ^\+?[0-9]{10,15}$
          description: 10 a 15 dígitos, con `+` opcional; null lo borra.
    DeleteMeRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          maxLength: 72
    ImagePurpose:
      type: string
      enum:
        - item_photo
        - evidence
      description: item_photo es pública; evidence es privada (solo las partes de la reserva).
    UploadSignatureRequest:
      type: object
      required:
        - purpose
      properties:
        purpose:
          $ref: '#/components/schemas/ImagePurpose'
    UploadSignature:
      type: object
      description: Datos para subir una imagen directo a Cloudinary (RF-01). Nunca incluye el API secret.
      required:
        - uploadUrl
        - apiKey
        - timestamp
        - signature
        - publicId
        - type
        - allowedFormats
        - overwrite
      properties:
        uploadUrl:
          type: string
          format: uri
        apiKey:
          type: string
          description: API key pública de Cloudinary (no es secreta).
        timestamp:
          type: integer
          description: Segundos Unix; Cloudinary rechaza firmas de más de 1 h.
        signature:
          type: string
          description: SHA-256 en hexadecimal de los parámetros firmados.
        publicId:
          type: string
          description: <carpeta base>/<purpose>/<userId>/<id>; enviarlo sin cambios como public_id.
        type:
          type: string
          enum:
            - upload
            - authenticated
        allowedFormats:
          type: string
          const: jpg,jpeg,png,webp
        overwrite:
          type: string
          const: 'false'
          description: Va firmado; impide volver a subir encima de una imagen ya verificada.
    ImageInput:
      type: object
      description: Referencia a una imagen ya subida, que reciben las demás rutas (RF-05). Máximo 5 por recurso.
      required:
        - publicId
      properties:
        publicId:
          type: string
          maxLength: 255
    Image:
      type: object
      description: |
        Imagen verificada con Cloudinary (RF-06, RF-07). Las URL se calculan al
        leer; las de entrega authenticated caducan a los 10 minutos.
      required:
        - publicId
        - width
        - height
        - format
        - bytes
        - delivery
        - url
        - thumbUrl
      properties:
        publicId:
          type: string
        width:
          type: integer
        height:
          type: integer
        format:
          type: string
          enum:
            - jpg
            - jpeg
            - png
            - webp
        bytes:
          type: integer
          maximum: 5242880
        delivery:
          type: string
          enum:
            - public
            - authenticated
        url:
          type: string
          format: uri
        thumbUrl:
          type: string
          format: uri
    CategoryKey:
      type: string
      description: Categorías de POL-14.
      enum:
        - herramientas_manuales
        - herramientas_electricas
        - construccion_jardineria
        - movilidad
        - deportes
        - hogar
        - otros
    Category:
      type: object
      required:
        - key
        - label
      properties:
        key:
          $ref: '#/components/schemas/CategoryKey'
        label:
          type: string
    ItemCondition:
      type: string
      enum:
        - new
        - like_new
        - good
        - fair
        - worn
    ItemModality:
      type: string
      enum:
        - loan
        - rent
      description: loan = préstamo gratuito; rent = renta por día.
    PriceSource:
      type: string
      enum:
        - manual
        - suggested
    ItemStatus:
      type: string
      enum:
        - active
        - paused
        - blocked
      description: blocked lo pone moderación (spec 011). Los objetos eliminados nunca se devuelven.
    Zone:
      type: object
      required:
        - municipality
      properties:
        municipality:
          type: string
          minLength: 2
          maxLength: 60
        neighborhood:
          type:
            - string
            - 'null'
          maxLength: 60
    ApproxLocation:
      type: object
      description: Ubicación aproximada; el servidor la redondea a 2 decimales (~1 km, RF-04).
      required:
        - lat
        - lng
      properties:
        lat:
