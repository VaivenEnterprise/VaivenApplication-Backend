          format: date-time
          description: Fin de la ventana de 14 días; null si la reserva aún no se completó.
    IncidentReason:
      type: string
      enum:
        - no_show
        - late_return
        - damaged
        - not_returned
        - payment_dispute
        - other
    IncidentStatus:
      type: string
      enum:
        - open
        - closed
    IncidentOutcome:
      type: string
      enum:
        - none
        - monetary_adjustment
        - restriction
    IncidentInput:
      type: object
      required:
        - reason
        - description
      properties:
        reason:
          $ref: '#/components/schemas/IncidentReason'
        description:
          type: string
          minLength: 10
          maxLength: 1000
        evidence:
          type: array
          maxItems: 5
          description: Imágenes con propósito `evidence` subidas por quien reporta (puede omitirse).
          items:
            $ref: '#/components/schemas/ImageInput'
    Incident:
      type: object
      required:
        - id
        - bookingId
        - reporter
        - reported
        - reason
        - description
        - evidence
        - status
        - notes
        - finalResponse
        - createdAt
        - closedAt
      properties:
        id:
          type: string
        bookingId:
          type: string
        reporter:
          $ref: '#/components/schemas/PublicUser'
        reported:
          $ref: '#/components/schemas/PublicUser'
        reason:
          $ref: '#/components/schemas/IncidentReason'
        description:
          type: string
        evidence:
          type: array
          description: Evidencia con URL firmadas de 10 minutos.
          items:
            $ref: '#/components/schemas/Image'
        status:
          $ref: '#/components/schemas/IncidentStatus'
        notes:
          type: array
          description: Las partes ven solo las notas visibles; el administrador ve todas, con `visibleToParties`.
          items:
            type: object
            required:
              - text
              - at
            properties:
              text:
                type: string
              at:
                type: string
                format: date-time
              visibleToParties:
                type: boolean
                description: Solo en la vista de administración.
        finalResponse:
          oneOf:
            - type: object
              required:
                - text
                - outcome
                - at
              properties:
                text:
                  type: string
                outcome:
                  $ref: '#/components/schemas/IncidentOutcome'
                at:
                  type: string
                  format: date-time
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        closedAt:
          type:
            - string
            - 'null'
          format: date-time
    IncidentPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
        nextCursor:
          type:
            - string
            - 'null'
    AddIncidentNoteRequest:
      type: object
      required:
        - text
        - visibleToParties
      properties:
        text:
          type: string
          minLength: 3
          maxLength: 1000
        visibleToParties:
          type: boolean
    CloseIncidentRequest:
      type: object
      required:
        - finalResponse
        - outcome
      properties:
        finalResponse:
          type: string
          minLength: 5
          maxLength: 1000
        outcome:
          $ref: '#/components/schemas/IncidentOutcome'
    SanctionType:
      type: string
      enum:
        - warning
        - suspension
    SanctionInput:
      type: object
      required:
        - type
        - reason
      properties:
        type:
          $ref: '#/components/schemas/SanctionType'
        reason:
          type: string
          minLength: 5
          maxLength: 500
        endsAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Obligatorio y futuro en `suspension`; debe omitirse en `warning`.
        incidentId:
          type:
            - string
            - 'null'
          description: Incidencia que motiva la sanción (opcional; debe existir).
    Sanction:
      type: object
      required:
        - id
        - userId
        - type
        - reason
        - endsAt
        - incidentId
        - createdAt
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          $ref: '#/components/schemas/SanctionType'
        reason:
          type: string
        endsAt:
          type:
            - string
            - 'null'
          format: date-time
        incidentId:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
    ErrorCode:
      type: string
      description: Códigos permitidos por el Art. IV.3 de la constitución.
      enum:
        - validation_failed
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - rate_limited
        - internal_error
        - service_unavailable
    ErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
        issue:
          type: string
    Error:
      type: object
      description: Envoltorio único de errores (Art. IV.3).
      examples:
        - error:
            code: validation_failed
            message: Revisa los datos marcados.
            details:
              - field: email
                issue: formato inválido
            requestId: 43d4c7dbb802d8b3711c8f4163ffc823
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Texto legible en español (es-MX).
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            requestId:
              type: string
  responses:
    ValidationFailed:
      description: Datos inválidos; `details` indica cada campo.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_failed
              message: Revisa los datos marcados.
              details:
                - field: email
                  issue: formato inválido
              requestId: 43d4c7dbb802d8b3711c8f4163ffc823
    Unauthorized:
      description: Falta el token, es inválido o venció; también un refreshToken inválido o reutilizado.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Tu sesión no es válida o venció. Inicia sesión de nuevo.
              requestId: 43d4c7dbb802d8b3711c8f4163ffc823
    ServiceUnavailable:
      description: |
        Una dependencia obligatoria no responde (MongoDB, Cloudinary) o hay
        demasiadas solicitudes de contraseña en curso (espera de turno de
        argon2id agotada, 2 s). Se puede reintentar.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: service_unavailable
              message: El servicio no está disponible por ahora. Intenta de nuevo en unos minutos.
              requestId: 43d4c7dbb802d8b3711c8f4163ffc823
    Forbidden:
      description: La persona no tiene permiso (no es la dueña o su cuenta está suspendida).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: No tienes permiso para esta acción.
              requestId: 43d4c7dbb802d8b3711c8f4163ffc823
    NotFound:
      description: El recurso no existe o la persona no puede verlo.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: No encontramos lo que buscas.
              requestId: 43d4c7dbb802d8b3711c8f4163ffc823
    Conflict:
      description: El estado actual no permite la acción (versión desactualizada, objeto bloqueado o con reservas activas).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: conflict
              message: El objeto cambió mientras lo editabas. Vuelve a cargarlo.
              requestId: 43d4c7dbb802d8b3711c8f4163ffc823
    MethodNotAllowed:
      description: Método no permitido para la ruta; usa el código not_found.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Este método no está permitido para esta ruta.
              requestId: 43d4c7dbb802d8b3711c8f4163ffc823
    RateLimited:
      description: Se superó el límite de peticiones por IP o por usuario (Art. XIV.2).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          description: Segundos que conviene esperar antes de reintentar.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limited
              message: Hiciste demasiadas solicitudes. Espera un momento e intenta de nuevo.
              requestId: 43d4c7dbb802d8b3711c8f4163ffc823
    InternalError:
      description: Fallo inesperado; nunca expone detalles internos.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: Ocurrió un error inesperado. Intenta de nuevo.
              requestId: 43d4c7dbb802d8b3711c8f4163ffc823
    BookingOk:
      description: Solicitud o reserva.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Booking'
    StageOk:
      description: Etapa de entrega o devolución.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Stage'
    responses-BookingOk:
      description: La reserva actualizada.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Booking'
