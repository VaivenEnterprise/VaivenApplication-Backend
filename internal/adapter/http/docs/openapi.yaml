              prestamo:
                summary: Préstamo gratuito
                value:
                  title: Escalera de tijera
                  description: Aluminio, 6 peldaños.
                  category: construccion_jardineria
                  condition: like_new
                  modality: loan
                  declaredValueCents: 150000
                  pricePerDayCents: 0
                  priceSource: manual
                  zone:
                    municipality: Tlalpan
                  photos:
                    - publicId: vaiven/staging/item_photo/6730f1c2a9b3e4d5f6a7b8c9/2c6e7f809b2f6c1e4a7d4c0e8f3b5a2d
