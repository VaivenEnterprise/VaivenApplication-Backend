    BookingPayment:
      type: object
      required:
        - stage
        - amountCents
        - status
        - reportedAt
        - note
        - confirmedAt
      properties:
        stage:
          $ref: '#/components/schemas/PaymentStage'
        amountCents:
          type: integer
        status:
          type: string
          enum:
            - pending
            - reported
            - confirmed
          description: |
            `pending` → `reported` (lo informa el solicitante) → `confirmed` (lo
            confirma el propietario). VAIVÉN no cobra ni verifica el pago (spec 009).
        reportedAt:
          type:
            - string
            - 'null'
          format: date-time
        note:
          type:
            - string
            - 'null'
          description: Nota opcional del reporte de pago (hasta 200 caracteres).
        confirmedAt:
          type:
            - string
            - 'null'
          format: date-time
    Stage:
      type: object
      description: |
        Etapa presencial de la reserva: la entrega o la devolución (spec 009). Las
        fotografías son privadas y traen URL firmadas de 10 minutos. Nunca incluye
        el token ni su hash.
      required:
        - recordedAt
        - recordedById
        - conditionNotes
        - photos
        - evidenceVersion
        - qr
        - confirmedAt
        - confirmedById
      properties:
        recordedAt:
          type:
            - string
            - 'null'
          format: date-time
        recordedById:
          type:
            - string
            - 'null'
        conditionNotes:
          type: string
          description: Estado del objeto; vacío mientras no haya evidencia.
        photos:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Image'
        evidenceVersion:
          type: integer
          description: 0 sin evidencia; sube al reemplazarla.
        qr:
          type: object
          required:
            - state
            - expiresAt
          properties:
            state:
              type: string
              enum:
                - none
                - active
                - expired
                - used
            expiresAt:
              type:
                - string
                - 'null'
              format: date-time
              description: Solo con QR activo o vencido.
        confirmedAt:
          type:
            - string
            - 'null'
          format: date-time
        confirmedById:
          type:
            - string
            - 'null'
    EvidenceRequest:
      type: object
      required:
        - conditionNotes
        - photos
      properties:
        conditionNotes:
          type: string
          minLength: 3
          maxLength: 500
        photos:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            required:
              - publicId
            properties:
              publicId:
                type: string
                description: Imagen subida con propósito `evidence` (spec 004).
    QrToken:
      type: object
      required:
        - token
        - qrPayload
        - expiresAt
      properties:
        token:
          type: string
          description: 32 bytes aleatorios en base64url. Solo se devuelve aquí.
        qrPayload:
          type: string
          description: Texto que codifica el QR, `vaiven://qr?b=<reserva>&s=<delivery|return>&t=<token>`.
        expiresAt:
          type: string
          format: date-time
          description: 15 minutos después de generarlo (POL-06).
    ConfirmHandoverRequest:
      type: object
      required:
        - token
      properties:
