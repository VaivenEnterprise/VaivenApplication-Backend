        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - objetos
      operationId: updateItem
      summary: Editar un objeto (solo el dueño)
      description: |
        Cambia los campos enviados (RF-07). `version` es obligatorio: si no
        coincide con la guardada responde 409 y hay que volver a leer el objeto
        (control optimista). El objeto resultante debe cumplir las mismas reglas que
        al publicarlo (modalidad, precio, sugerencia). `photos` reemplaza la lista
        completa. `usageRules` y `approxLocation` en null los borran. Cambiar el
        precio no altera reservas existentes (spec 007). Un objeto `blocked` no se
        puede editar (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdate'
            example:
              version: 1
              pricePerDayCents: 3500
              priceSource: manual
      responses:
        '200':
          description: Objeto actualizado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - objetos
      operationId: deleteItem
      summary: Eliminar un objeto (solo el dueño)
      description: |
        Marca el objeto como `removed`; deja de verse para todos (RF-09). Si tiene
        reservas aceptadas o en curso responde 409 (CA-07). No hay borrado físico.
      responses:
        '204':
          description: Objeto eliminado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
