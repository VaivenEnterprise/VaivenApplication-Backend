          minimum: 0
    Quote:
      type: object
      required:
        - itemId
        - startDate
        - endDate
        - days
        - modality
        - pricePerDayCents
        - totalCents
        - currency
        - paymentMode
        - payments
        - policy
      properties:
        itemId:
          type: string
        startDate:
          $ref: '#/components/schemas/CalendarDate'
        endDate:
          $ref: '#/components/schemas/CalendarDate'
        days:
          type: integer
          minimum: 1
          maximum: 7
        modality:
          $ref: '#/components/schemas/ItemModality'
        pricePerDayCents:
          type: integer
        totalCents:
          type: integer
        currency:
          type: string
          const: MXN
        paymentMode:
          $ref: '#/components/schemas/PaymentMode'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/QuotePayment'
        policy:
          type: object
          required:
            - requestExpiresInHours
            - lateCancellationNotice
            - noShowNotice
          properties:
            requestExpiresInHours:
              type: integer
              const: 48
            lateCancellationNotice:
              type: string
            noShowNotice:
              type: string
      example:
        itemId: 6731a2b3c4d5e6f7a8b9c0d1
        startDate: '2026-11-10'
        endDate: '2026-11-12'
        days: 3
        modality: rent
        pricePerDayCents: 3000
        totalCents: 9000
        currency: MXN
        paymentMode: split_50_50
        payments:
          - stage: delivery
            amountCents: 4500
          - stage: return
            amountCents: 4500
        policy:
          requestExpiresInHours: 48
          lateCancellationNotice: Cancelar tarde no tiene cargo automático, pero puede registrarse una incidencia.
          noShowNotice: Si no te presentas a la entrega o la devolución puede registrarse una incidencia y una advertencia o suspensión.
    BookingRequest:
      type: object
      required:
        - itemId
        - startDate
        - endDate
        - paymentMode
        - acceptedTotalCents
      properties:
        itemId:
          type: string
          pattern: ^[0-9a-f]{24}$
        startDate:
          $ref: '#/components/schemas/CalendarDate'
        endDate:
          $ref: '#/components/schemas/CalendarDate'
        paymentMode:
          $ref: '#/components/schemas/PaymentMode'
        acceptedTotalCents:
          type: integer
          minimum: 0
          description: Total que mostró la cotización; si cambió, 409 con detalle quote_changed.
