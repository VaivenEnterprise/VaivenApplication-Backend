          type: string
          pattern: ^[0-9a-f]{24}$
      - $ref: '#/components/parameters/RequestId'
    get:
      tags:
        - objetos
      operationId: getItem
      summary: Detalle de un objeto
      description: |
        Devuelve el objeto con el perfil público de quien lo ofrece (RF-06).
        `active` lo ve cualquier persona autenticada; `paused` y `blocked`, solo su
        dueño y admin (404 para los demás); `removed`, nadie (404).
        `declaredValueCents` es null si quien consulta no es el dueño ni admin.
      responses:
        '200':
          description: Detalle del objeto.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
