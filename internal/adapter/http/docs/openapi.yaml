openapi: 3.1.0
info:
  title: VAIVÉN API
  version: 0.6.0
  summary: API REST del backend de VAIVÉN (préstamo y renta de objetos en México).
  description: |
    Contrato de la spec 002 (arquitectura base): endpoints de infraestructura y
    el envoltorio único de errores (Art. IV de la constitución). La spec 003
    agrega la cuenta y la autenticación (`api/paths/auth.yaml` y `users.yaml`) y
    la spec 004 las imágenes (`api/paths/uploads.yaml`) y la spec 005 los objetos
    (`api/paths/items.yaml`); la spec 006 la búsqueda (`api/paths/search.yaml`).

    - Rutas de negocio bajo `/api/v1`; `/healthz` y `/readyz` fuera del prefijo.
    - JSON en `camelCase`; fechas en ISO-8601 UTC.
    - Toda respuesta trae `X-Request-Id`: si la petición envía uno válido
      (≤ 64 caracteres alfanuméricos y guiones) se reutiliza; si no, se genera.
    - Las specs siguientes agregan sus rutas en `api/paths/<modulo>.yaml`.
    - Autenticación (spec 003): `Authorization: Bearer <accessToken>` (JWT de
      15 min). Las rutas sin autenticación declaran `security: []`.
servers:
  - url: https://vaiven-staging.westus2.cloudapp.azure.com:8443
    description: Staging (Azure)
  - url: http://localhost:8080
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: infraestructura
    description: Salud del proceso y de sus dependencias.
  - name: meta
    description: Información del servicio para el cliente móvil.
  - name: auth
    description: Registro, inicio de sesión y tokens (spec 003).
  - name: cuenta
    description: La cuenta de la persona autenticada (spec 003).
  - name: usuarios
    description: Perfiles públicos (spec 003).
  - name: imagenes
    description: Subida de imágenes a Cloudinary con firma del servidor (spec 004).
  - name: objetos
    description: Publicar, editar y pausar objetos; precio sugerido y categorías (spec 005).
  - name: busqueda
    description: Buscar objetos por texto, categoría, zona, cercanía y fechas (spec 006).
paths:
  /healthz:
    get:
      tags:
        - infraestructura
      operationId: getHealthz
      security: []
      summary: El proceso está vivo
      description: Responde 200 mientras el proceso vive; no consulta dependencias.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: El proceso está vivo.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
              example:
                status: ok
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /readyz:
    get:
      tags:
        - infraestructura
      operationId: getReadyz
      security: []
      summary: El servicio puede atender peticiones
      description: |
        Hace ping a MongoDB (máximo 2 s). Responde 503 `service_unavailable` solo si
        MongoDB no responde. Redis nunca es fuente de verdad: si falla, responde 200
        con `redis: degradado` (Art. XIV.2).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: MongoDB responde.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
              example:
                status: ready
                redis: ok
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/meta:
    get:
      tags:
        - meta
      operationId: getMeta
      security: []
      summary: Información del servicio
      description: Permite al móvil comprobar conectividad y versión.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Datos del servicio.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
              example:
                name: vaiven-backend
                version: 0.2.0
                environment: staging
                serverTime: '2026-11-07T15:00:00Z'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/register:
    post:
      tags:
        - auth
      operationId: register
      summary: Crear una cuenta
      description: |
        Crea la cuenta y abre la sesión (RF-01). El correo se normaliza (minúsculas,
        sin espacios) y debe ser único (RF-02). La persona debe aceptar los términos
        y declarar que es mayor de edad (POL-12). Límite: 10 peticiones por minuto
        por IP (RF-07).
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: ana@example.com
              password: una-contrasena-larga
              displayName: Ana
              acceptTerms: true
              isAdult: true
      responses:
        '201':
          description: Cuenta creada; la sesión queda abierta.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: El correo ya tiene una cuenta (sin importar mayúsculas).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: conflict
                  message: Ya existe una cuenta con ese correo.
                  requestId: 43d4c7dbb802d8b3711c8f4163ffc823
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/login:
    post:
      tags:
        - auth
      operationId: login
      summary: Iniciar sesión
      description: |
        Devuelve el usuario y tokens nuevos (RF-04). Ante credenciales inválidas o
        una cuenta dada de baja responde 401 con un mensaje genérico que no revela
        si el correo existe. Límites: 10 peticiones por minuto por IP (RF-07) y
        20 intentos por cuenta cada 15 minutos (429 con `Retry-After: 900`).
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ana@example.com
              password: una-contrasena-larga
      responses:
        '200':
          description: Sesión iniciada.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Correo o contraseña incorrectos.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: unauthorized
                  message: El correo o la contraseña no son correctos.
                  requestId: 43d4c7dbb802d8b3711c8f4163ffc823
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/refresh:
    post:
      tags:
        - auth
      operationId: refreshTokens
      summary: Renovar la sesión
      description: |
        Rotación (RF-05): entrega un par nuevo e invalida el `refreshToken` usado.
        Reutilizar un `refreshToken` ya usado revoca toda su familia (todas las
        sesiones abiertas a partir del mismo inicio de sesión) y responde 401.
        Límite: 10 peticiones por minuto por IP (RF-07).
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens nuevos.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                  - tokens
                properties:
                  tokens:
                    $ref: '#/components/schemas/Tokens'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags:
        - auth
      operationId: logout
      summary: Cerrar sesión
      description: |
        Revoca la familia del `refreshToken` (RF-06). Es idempotente: un token
        desconocido, vencido o ya revocado también responde 204. El token de
        acceso sigue siendo válido hasta que vence (15 min); el móvil lo descarta.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Sesión cerrada.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me:
    get:
      tags:
        - cuenta
      operationId: getMe
      summary: Mi cuenta
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Datos de la cuenta propia.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - cuenta
      operationId: updateMe
      summary: Editar mi perfil
      description: |
        Cambia solo los campos enviados (RF-08). `phone: null` borra el teléfono.
        El teléfono nunca aparece en el perfil público.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            example:
              displayName: Ana López
              phone: '+525512345678'
      responses:
        '200':
          description: Perfil actualizado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - cuenta
      operationId: deleteMe
      summary: Dar de baja mi cuenta
      description: |
        Baja con confirmación de contraseña (RF-08, POL-17): anonimiza correo,
        nombre y teléfono, revoca todas las sesiones y la cuenta deja de aceptar
        inicio de sesión. El correo original queda libre para una cuenta nueva.
        Si hay reservas activas responde 409 (cuando exista la spec 007).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMeRequest'
      responses:
        '204':
          description: Cuenta dada de baja.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            La contraseña no es correcta. Se usa 403 y no 401 para que el móvil no
            lo confunda con una sesión vencida.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: forbidden
                  message: La contraseña no es correcta.
                  requestId: 43d4c7dbb802d8b3711c8f4163ffc823
        '409':
          description: Hay reservas activas; termínalas antes de dar de baja la cuenta.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: conflict
                  message: Tienes reservas activas. Termínalas antes de dar de baja tu cuenta.
                  requestId: 43d4c7dbb802d8b3711c8f4163ffc823
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/{id}:
    get:
      tags:
        - usuarios
      operationId: getUser
      summary: Perfil público de una persona
      description: |
        Expone solo el mínimo (RF-09, Art. VI.4): nunca correo ni teléfono. Una
        cuenta dada de baja se muestra como «Cuenta eliminada».
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          description: Identificador del usuario (24 caracteres hexadecimales).
          schema:
            type: string
            pattern: ^[0-9a-f]{24}$
      responses:
        '200':
          description: Perfil público.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
              example:
                id: 6730f1c2a9b3e4d5f6a7b8c9
                displayName: Ana
                ratingAverage: null
                ratingCount: 0
                memberSince: '2026-11-06T18:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No existe un usuario con ese identificador.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: not_found
                  message: No encontramos a esa persona.
                  requestId: 43d4c7dbb802d8b3711c8f4163ffc823
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/uploads/signature:
    post:
      tags:
        - imagenes
      operationId: createUploadSignature
      summary: Firma para subir una imagen
      description: |
        Devuelve lo necesario para subir **una** imagen directamente a Cloudinary
        (RF-01). El cliente envía a `uploadUrl` un `multipart/form-data` con `file`,
        `api_key`, `timestamp`, `signature`, `public_id`, `type`, `allowed_formats` y
        `overwrite` (los valores de esta respuesta, sin cambiarlos). La firma vale para ese
        `publicId`; el API secret nunca sale del servidor (RNF-01).

        - `item_photo` → `type: upload` (pública); `evidence` → `type: authenticated`
          (privada, solo con URL firmada de 10 min).
        - Después, las demás rutas reciben la imagen como `ImageInput`
          (`{ "publicId": "…" }`) y el servidor la verifica con Cloudinary: que sea
          de quien la envía, formato jpg, jpeg, png o webp y ≤ 5 MB (POL-13).
        - Límite: 30 firmas por persona y por hora (RF-04).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadSignatureRequest'
            example:
              purpose: item_photo
      responses:
        '200':
          description: Firma de un solo uso para subir la imagen.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSignature'
              example:
                uploadUrl: https://api.cloudinary.com/v1_1/vaiven/image/upload
                apiKey: '123456789012345'
                timestamp: 1762480800
                signature: 3f1c2d9a8b7e6f5a4d3c2b1a0f9e8d7c6b5a4f3e
                publicId: vaiven/staging/item_photo/6730f1c2a9b3e4d5f6a7b8c9/9b2f6c1e4a7d4c0e8f3b5a2d1c6e7f80
                type: upload
                allowedFormats: jpg,jpeg,png,webp
                overwrite: 'false'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/items:
    get:
      tags:
        - busqueda
      operationId: searchItems
      summary: Buscar objetos
      description: |
        Devuelve tarjetas de objetos `active` de otras personas con cuenta activa
        (RF-02); nunca los propios. Tres modos de orden:

        - **Reciente** (sin `q` ni `lat`/`lng`): por fecha de publicación descendente.
        - **Texto** (`q` sin ubicación): por relevancia en título y descripción, en
          español, sin importar acentos ni mayúsculas (RF-04).
        - **Cercanía** (`lat` y `lng`): por `distanceKm` ascendente dentro de
          `radiusKm` (25 km por defecto). Si además hay `q`, cada palabra (hasta 8)
          debe aparecer en el título o la descripción, sin importar acentos ni
          mayúsculas, y el orden sigue siendo por distancia. En el modo texto basta
          con que aparezca alguna palabra (orden por relevancia).

        `municipality` es igualdad exacta sin importar acentos ni mayúsculas.

        Con `from` y `to` excluye objetos con una reserva aceptada o en curso que se
        cruce con el periodo; una solicitud pendiente no bloquea (RF-03). Las fechas
        son de calendario en America/Mexico_City: `from` no puede ser anterior a
        hoy, `to ≥ from` y el periodo dura como máximo 7 días (POL-02).

        Para la página siguiente se envía `cursor` con el `nextCursor` recibido y los
        **mismos** filtros (null = no hay más).
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: q
          in: query
          required: false
          description: Texto a buscar (2 a 80 caracteres).
          schema:
            type: string
            minLength: 2
            maxLength: 80
          example: taladro
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CategoryKey'
        - name: modality
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ItemModality'
        - name: municipality
          in: query
          required: false
          description: Municipio o alcaldía exactos (sin importar mayúsculas).
          schema:
            type: string
            minLength: 2
            maxLength: 60
        - name: from
          in: query
          required: false
          description: Primer día del periodo (`YYYY-MM-DD`); va junto con `to`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Último día del periodo (`YYYY-MM-DD`, inclusivo); va junto con `from`.
          schema:
            type: string
            format: date
        - name: lat
          in: query
          required: false
          description: Latitud de quien busca; va junto con `lng`.
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: false
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: radiusKm
          in: query
          required: false
          description: Radio en km (1 a 50; 25 por defecto). Solo con `lat` y `lng`.
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          description: Valor opaco de `nextCursor`.
          schema:
            type: string
            maxLength: 256
      responses:
        '200':
          description: Página de tarjetas.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCardPage'
              example:
                items:
                  - id: 6731a2b3c4d5e6f7a8b9c0d1
                    title: Taladro percutor 600 W
                    category: herramientas_electricas
                    modality: rent
                    pricePerDayCents: 3000
                    zone:
                      municipality: Coyoacán
                      neighborhood: Del Carmen
                    approxLocation:
                      lat: 19.35
                      lng: -99.16
                    distanceKm: 1.4
                    thumbUrl: https://res.cloudinary.com/vaiven/image/upload/c_fill,w_320,h_320/vaiven/staging/item_photo/6730f1c2a9b3e4d5f6a7b8c9/9b2f6c1e4a7d4c0e8f3b5a2d1c6e7f80.jpg
                    photoCount: 3
                    owner:
                      id: 6730f1c2a9b3e4d5f6a7b8c9
                      displayName: Ana
                      ratingAverage: 4.8
                      ratingCount: 12
                    createdAt: '2026-11-08T16:00:00Z'
                nextCursor: eyJtIjoibmVhciIsImsiOjE0MDAuNSwiaWQiOiI2NzMxYTJiM2M0ZDVlNmY3YThiOWMwZDEifQ
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags:
        - objetos
      operationId: createItem
      summary: Publicar un objeto
      description: |
        Crea un objeto `active` del que la persona autenticada es dueña (RF-01).

        - Préstamo (`loan`): `pricePerDayCents` debe ser 0 y `priceSource` `manual` (RF-02).
        - Renta (`rent`): `pricePerDayCents` entre 1000 ($10) y `declaredValueCents`.
        - `priceSource: suggested` exige que el precio sea igual a la sugerencia de
          `GET /items/price-suggestion`; el servidor la recalcula (RF-03).
        - `approxLocation` se redondea a 2 decimales antes de guardarse (RF-04).
        - `photos`: 1 a 5 imágenes subidas con propósito `item_photo` por la misma
          persona (POL-13); el servidor las verifica con Cloudinary.
        - Título, descripción y reglas pasan por moderación (RF-05).
        - Una cuenta suspendida recibe 403 (RF-12).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
            examples:
              renta:
                summary: Renta con el precio sugerido
                value:
                  title: Taladro percutor 600 W
                  description: Incluye estuche y 5 brocas para concreto.
                  category: herramientas_electricas
                  condition: good
                  modality: rent
                  declaredValueCents: 100000
                  pricePerDayCents: 3000
                  priceSource: suggested
                  usageRules: Devolver limpio. No usar en metal.
                  zone:
                    municipality: Coyoacán
                    neighborhood: Del Carmen
                  approxLocation:
                    lat: 19.349512
                    lng: -99.162301
                  photos:
                    - publicId: vaiven/staging/item_photo/6730f1c2a9b3e4d5f6a7b8c9/9b2f6c1e4a7d4c0e8f3b5a2d1c6e7f80
              prestamo:
                summary: Préstamo gratuito
                value:
                  title: Escalera de tijera
                  description: Aluminio, 6 peldaños.
                  category: construccion_jardineria
                  condition: like_new
                  modality: loan
                  declaredValueCents: 150000
                  pricePerDayCents: 0
                  priceSource: manual
                  zone:
                    municipality: Tlalpan
                  photos:
                    - publicId: vaiven/staging/item_photo/6730f1c2a9b3e4d5f6a7b8c9/2c6e7f809b2f6c1e4a7d4c0e8f3b5a2d
      responses:
        '201':
          description: Objeto publicado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/items/price-suggestion:
    get:
      tags:
        - objetos
      operationId: getPriceSuggestion
      summary: Precio sugerido por día
      description: |
        Calcula la sugerencia de POL-04: 3 % del valor declarado por día, mínimo
        $10 y redondeado hacia arriba a múltiplos de $5. No publica nada (RF-03).
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: declaredValueCents
          in: query
          required: true
          description: Valor declarado en centavos, de 5000 ($50) a 10000000 ($100,000).
          schema:
            type: integer
            minimum: 5000
            maximum: 10000000
          example: 100000
      responses:
        '200':
          description: Sugerencia en centavos.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceSuggestion'
              example:
                suggestedPricePerDayCents: 3000
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del objeto.
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      - $ref: '#/components/parameters/RequestId'
    get:
      tags:
        - objetos
      operationId: getItem
      summary: Detalle de un objeto
      description: |
        Devuelve el objeto con el perfil público de quien lo ofrece (RF-06).
        `active` lo ve cualquier persona autenticada; `paused` y `blocked`, solo su
        dueño y admin (404 para los demás); `removed`, nadie (404).
        `declaredValueCents` es null si quien consulta no es el dueño ni admin.
      responses:
        '200':
          description: Detalle del objeto.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - objetos
      operationId: updateItem
      summary: Editar un objeto (solo el dueño)
      description: |
        Cambia los campos enviados (RF-07). `version` es obligatorio: si no
        coincide con la guardada responde 409 y hay que volver a leer el objeto
        (control optimista). El objeto resultante debe cumplir las mismas reglas que
        al publicarlo (modalidad, precio, sugerencia). `photos` reemplaza la lista
        completa. `usageRules` y `approxLocation` en null los borran. Cambiar el
        precio no altera reservas existentes (spec 007). Un objeto `blocked` no se
        puede editar (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdate'
            example:
              version: 1
              pricePerDayCents: 3500
              priceSource: manual
      responses:
        '200':
          description: Objeto actualizado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - objetos
      operationId: deleteItem
      summary: Eliminar un objeto (solo el dueño)
      description: |
        Marca el objeto como `removed`; deja de verse para todos (RF-09). Si tiene
        reservas aceptadas o en curso responde 409 (CA-07). No hay borrado físico.
      responses:
        '204':
          description: Objeto eliminado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/items/{id}/pause:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      - $ref: '#/components/parameters/RequestId'
    post:
      tags:
        - objetos
      operationId: pauseItem
      summary: Pausar un objeto (solo el dueño)
      description: |
        Pasa de `active` a `paused`: no admite solicitudes nuevas y conserva los
        compromisos existentes (RF-08). Pausar uno ya pausado no cambia nada (200).
        Un objeto `blocked` responde 409.
      responses:
        '200':
          description: Objeto pausado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/items/{id}/resume:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      - $ref: '#/components/parameters/RequestId'
    post:
      tags:
        - objetos
      operationId: resumeItem
      summary: Reanudar un objeto (solo el dueño)
      description: |
        Pasa de `paused` a `active` (RF-08). Reanudar uno activo no cambia nada
        (200). Un objeto `blocked` responde 409: solo moderación lo desbloquea.
      responses:
        '200':
          description: Objeto activo.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me/items:
    get:
      tags:
        - objetos
      operationId: listMyItems
      summary: Mis objetos
      description: |
        Lista los objetos de la persona autenticada, más recientes primero (RF-10).
        Nunca incluye los `removed`. Sin `status` devuelve todos los demás estados.
        Para la página siguiente se envía `cursor` con el `nextCursor` recibido
        (null = no hay más).
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - paused
              - blocked
        - name: cursor
          in: query
          required: false
          description: Valor opaco de `nextCursor`.
          schema:
            type: string
            maxLength: 128
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Página de objetos.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/categories:
    get:
      tags:
        - objetos
      operationId: listCategories
      summary: Categorías
      description: Las categorías de POL-14, en el orden en que se muestran (RF-11).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Lista de categorías.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
              example:
                - key: herramientas_manuales
                  label: Herramientas manuales
                - key: herramientas_electricas
                  label: Herramientas eléctricas
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso que entregan login, register y refresh.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Identificador de la petición; se reutiliza si es válido.
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9-]{1,64}$
  headers:
    X-Request-Id:
      description: Identificador de la petición (el recibido si era válido o uno nuevo).
      schema:
        type: string
        maxLength: 64
  schemas:
    Status:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    Ready:
      type: object
      required:
        - status
        - redis
      properties:
        status:
          type: string
          enum:
            - ready
        redis:
          type: string
          enum:
            - ok
            - degradado
          description: Estado de Redis; degradado si no responde o no está configurado.
    Meta:
      type: object
      required:
        - name
        - version
        - environment
        - serverTime
      properties:
        name:
          type: string
        version:
          type: string
        environment:
          type: string
          enum:
            - development
            - test
            - staging
            - production
        serverTime:
          type: string
          format: date-time
          description: Hora del servidor en UTC (ISO-8601).
    Role:
      type: string
      enum:
        - user
        - admin
    User:
      type: object
      description: La cuenta propia (solo la ve su dueña).
      required:
        - id
        - email
        - displayName
        - phone
        - role
        - ratingAverage
        - ratingCount
        - createdAt
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        phone:
          type:
            - string
            - 'null'
        role:
          $ref: '#/components/schemas/Role'
        ratingAverage:
          type:
            - number
            - 'null'
          description: Promedio de calificaciones (1 a 5); null sin calificaciones (spec 010).
        ratingCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    PublicUser:
      type: object
      description: Perfil público; nunca incluye correo ni teléfono (Art. VI.4).
      required:
        - id
        - displayName
        - ratingAverage
        - ratingCount
        - memberSince
      properties:
        id:
          type: string
        displayName:
          type: string
          description: «Cuenta eliminada» si la cuenta se dio de baja.
        ratingAverage:
          type:
            - number
            - 'null'
        ratingCount:
          type: integer
          minimum: 0
        memberSince:
          type: string
          format: date-time
    Tokens:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
      properties:
        accessToken:
          type: string
          description: 'JWT HS256 para el encabezado `Authorization: Bearer`.'
        refreshToken:
          type: string
          description: Token opaco de un solo uso (30 días); se cambia en cada `refresh`.
        expiresIn:
          type: integer
          description: Segundos de vida del token de acceso (900).
    AuthResult:
      type: object
      required:
        - user
        - tokens
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/Tokens'
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - displayName
        - acceptTerms
        - isAdult
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Se guarda en minúsculas y sin espacios.
        password:
          type: string
          minLength: 8
          maxLength: 72
        displayName:
          type: string
          minLength: 2
          maxLength: 40
        acceptTerms:
          type: boolean
          const: true
          description: Aceptación de términos y privacidad (POL-12).
        isAdult:
          type: boolean
          const: true
          description: Declaración de mayoría de edad (POL-12).
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 72
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          maxLength: 128
    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 40
        phone:
          type:
            - string
            - 'null'
          pattern: ^\+?[0-9]{10,15}$
          description: 10 a 15 dígitos, con `+` opcional; null lo borra.
    DeleteMeRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          maxLength: 72
    ImagePurpose:
      type: string
      enum:
        - item_photo
        - evidence
      description: item_photo es pública; evidence es privada (solo las partes de la reserva).
    UploadSignatureRequest:
      type: object
      required:
        - purpose
      properties:
        purpose:
          $ref: '#/components/schemas/ImagePurpose'
    UploadSignature:
      type: object
      description: Datos para subir una imagen directo a Cloudinary (RF-01). Nunca incluye el API secret.
      required:
        - uploadUrl
        - apiKey
        - timestamp
        - signature
        - publicId
        - type
        - allowedFormats
        - overwrite
      properties:
        uploadUrl:
          type: string
          format: uri
        apiKey:
          type: string
          description: API key pública de Cloudinary (no es secreta).
        timestamp:
          type: integer
          description: Segundos Unix; Cloudinary rechaza firmas de más de 1 h.
        signature:
          type: string
          description: SHA-256 en hexadecimal de los parámetros firmados.
        publicId:
          type: string
          description: <carpeta base>/<purpose>/<userId>/<id>; enviarlo sin cambios como public_id.
        type:
          type: string
          enum:
            - upload
            - authenticated
        allowedFormats:
          type: string
          const: jpg,jpeg,png,webp
        overwrite:
          type: string
          const: 'false'
          description: Va firmado; impide volver a subir encima de una imagen ya verificada.
    ImageInput:
      type: object
      description: Referencia a una imagen ya subida, que reciben las demás rutas (RF-05). Máximo 5 por recurso.
      required:
        - publicId
      properties:
        publicId:
          type: string
          maxLength: 255
    Image:
      type: object
      description: |
        Imagen verificada con Cloudinary (RF-06, RF-07). Las URL se calculan al
        leer; las de entrega authenticated caducan a los 10 minutos.
      required:
        - publicId
        - width
        - height
        - format
        - bytes
        - delivery
        - url
        - thumbUrl
      properties:
        publicId:
          type: string
        width:
          type: integer
        height:
          type: integer
        format:
          type: string
          enum:
            - jpg
            - jpeg
            - png
            - webp
        bytes:
          type: integer
          maximum: 5242880
        delivery:
          type: string
          enum:
            - public
            - authenticated
        url:
          type: string
          format: uri
        thumbUrl:
          type: string
          format: uri
    CategoryKey:
      type: string
      description: Categorías de POL-14.
      enum:
        - herramientas_manuales
        - herramientas_electricas
        - construccion_jardineria
        - movilidad
        - deportes
        - hogar
        - otros
    Category:
      type: object
      required:
        - key
        - label
      properties:
        key:
          $ref: '#/components/schemas/CategoryKey'
        label:
          type: string
    ItemCondition:
      type: string
      enum:
        - new
        - like_new
        - good
        - fair
        - worn
    ItemModality:
      type: string
      enum:
        - loan
        - rent
      description: loan = préstamo gratuito; rent = renta por día.
    PriceSource:
      type: string
      enum:
        - manual
        - suggested
    ItemStatus:
      type: string
      enum:
        - active
        - paused
        - blocked
      description: blocked lo pone moderación (spec 011). Los objetos eliminados nunca se devuelven.
    Zone:
      type: object
      required:
        - municipality
      properties:
        municipality:
          type: string
          minLength: 2
          maxLength: 60
        neighborhood:
          type:
            - string
            - 'null'
          maxLength: 60
    ApproxLocation:
      type: object
      description: Ubicación aproximada; el servidor la redondea a 2 decimales (~1 km, RF-04).
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    ItemInput:
      type: object
      required:
        - title
        - description
        - category
        - condition
        - modality
        - declaredValueCents
        - pricePerDayCents
        - priceSource
        - zone
        - photos
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 80
        description:
          type: string
          maxLength: 1000
        category:
          $ref: '#/components/schemas/CategoryKey'
        condition:
          $ref: '#/components/schemas/ItemCondition'
        modality:
          $ref: '#/components/schemas/ItemModality'
        declaredValueCents:
          type: integer
          minimum: 5000
          maximum: 10000000
          description: Valor declarado en centavos ($50 a $100,000). Solo lo ven el dueño y admin.
        pricePerDayCents:
          type: integer
          minimum: 0
          description: 0 en préstamo; en renta de 1000 ($10) al valor declarado.
        priceSource:
          $ref: '#/components/schemas/PriceSource'
        usageRules:
          type:
            - string
            - 'null'
          maxLength: 500
        zone:
          $ref: '#/components/schemas/Zone'
        approxLocation:
          oneOf:
            - $ref: '#/components/schemas/ApproxLocation'
            - type: 'null'
        photos:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/ImageInput'
    ItemUpdate:
      type: object
      description: Campos a cambiar más la versión leída (control optimista). Al menos un campo además de version.
      required:
        - version
      minProperties: 2
      properties:
        version:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 3
          maxLength: 80
        description:
          type: string
          maxLength: 1000
        category:
          $ref: '#/components/schemas/CategoryKey'
        condition:
          $ref: '#/components/schemas/ItemCondition'
        modality:
          $ref: '#/components/schemas/ItemModality'
        declaredValueCents:
          type: integer
          minimum: 5000
          maximum: 10000000
          description: Valor declarado en centavos ($50 a $100,000). Solo lo ven el dueño y admin.
        pricePerDayCents:
          type: integer
          minimum: 0
          description: 0 en préstamo; en renta de 1000 ($10) al valor declarado.
        priceSource:
          $ref: '#/components/schemas/PriceSource'
        usageRules:
          type:
            - string
            - 'null'
          maxLength: 500
        zone:
          $ref: '#/components/schemas/Zone'
        approxLocation:
          oneOf:
            - $ref: '#/components/schemas/ApproxLocation'
            - type: 'null'
        photos:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/ImageInput'
    Item:
      type: object
      required:
        - id
        - owner
        - title
        - description
        - category
        - condition
        - modality
        - declaredValueCents
        - pricePerDayCents
        - priceSource
        - usageRules
