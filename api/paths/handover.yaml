components:
  parameters:
    BookingId:
      name: id
      in: path
      required: true
      description: Identificador de la reserva.
      schema:
        type: string
        pattern: '^[0-9a-f]{24}$'
  responses:
    StageOk:
      description: Etapa de entrega o devolución.
      headers:
        X-Request-Id:
          $ref: '../openapi.yaml#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/Stage'
    BookingOk:
      description: La reserva actualizada.
      headers:
        X-Request-Id:
          $ref: '../openapi.yaml#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/Booking'
