openapi: 3.1.0
info:
  title: VAIVÉN API
  version: 0.4.0
  summary: API REST del backend de VAIVÉN (préstamo y renta de objetos en México).
  description: |
    Contrato de la spec 002 (arquitectura base): endpoints de infraestructura y
    el envoltorio único de errores (Art. IV de la constitución). La spec 003
    agrega la cuenta y la autenticación (`api/paths/auth.yaml` y `users.yaml`) y
    la spec 004 las imágenes (`api/paths/uploads.yaml`).

    - Rutas de negocio bajo `/api/v1`; `/healthz` y `/readyz` fuera del prefijo.
    - JSON en `camelCase`; fechas en ISO-8601 UTC.
    - Toda respuesta trae `X-Request-Id`: si la petición envía uno válido
      (≤ 64 caracteres alfanuméricos y guiones) se reutiliza; si no, se genera.
    - Las specs siguientes agregan sus rutas en `api/paths/<modulo>.yaml`.
    - Autenticación (spec 003): `Authorization: Bearer <accessToken>` (JWT de
      15 min). Las rutas sin autenticación declaran `security: []`.
security:
  - bearerAuth: []
servers:
  - url: https://vaiven-staging.westus2.cloudapp.azure.com:8443
    description: Staging (Azure)
  - url: http://localhost:8080
    description: Desarrollo local
tags:
  - name: infraestructura
    description: Salud del proceso y de sus dependencias.
  - name: meta
    description: Información del servicio para el cliente móvil.
  - name: auth
    description: Registro, inicio de sesión y tokens (spec 003).
  - name: cuenta
    description: La cuenta de la persona autenticada (spec 003).
  - name: usuarios
    description: Perfiles públicos (spec 003).
  - name: imagenes
    description: Subida de imágenes a Cloudinary con firma del servidor (spec 004).
paths:
  /healthz:
    get:
      tags: [infraestructura]
      operationId: getHealthz
      security: []
      summary: El proceso está vivo
      description: Responde 200 mientras el proceso vive; no consulta dependencias.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: El proceso está vivo.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
              example:
                status: ok
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /readyz:
    get:
      tags: [infraestructura]
      operationId: getReadyz
      security: []
      summary: El servicio puede atender peticiones
      description: |
        Hace ping a MongoDB (máximo 2 s). Responde 503 `service_unavailable` solo si
        MongoDB no responde. Redis nunca es fuente de verdad: si falla, responde 200
        con `redis: degradado` (Art. XIV.2).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: MongoDB responde.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
              example:
                status: ready
                redis: ok
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/meta:
    get:
      tags: [meta]
      operationId: getMeta
      security: []
      summary: Información del servicio
      description: Permite al móvil comprobar conectividad y versión.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Datos del servicio.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
              example:
                name: vaiven-backend
                version: 0.2.0
                environment: staging
                serverTime: '2026-11-07T15:00:00Z'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/register:
    $ref: './paths/auth.yaml#/register'
  /api/v1/auth/login:
    $ref: './paths/auth.yaml#/login'
  /api/v1/auth/refresh:
    $ref: './paths/auth.yaml#/refresh'
  /api/v1/auth/logout:
    $ref: './paths/auth.yaml#/logout'
  /api/v1/me:
    $ref: './paths/auth.yaml#/me'
  /api/v1/users/{id}:
    $ref: './paths/users.yaml#/userById'
  /api/v1/uploads/signature:
    $ref: './paths/uploads.yaml#/signature'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token de acceso que entregan login, register y refresh."
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Identificador de la petición; se reutiliza si es válido.
      schema:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9-]{1,64}$'
  headers:
    X-Request-Id:
      description: Identificador de la petición (el recibido si era válido o uno nuevo).
      schema:
        type: string
        maxLength: 64
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Ready:
      type: object
      required: [status, redis]
      properties:
        status:
          type: string
          enum: [ready]
        redis:
          type: string
          enum: [ok, degradado]
          description: Estado de Redis; degradado si no responde o no está configurado.
    Meta:
      type: object
      required: [name, version, environment, serverTime]
      properties:
        name:
          type: string
        version:
          type: string
        environment:
          type: string
          enum: [development, test, staging, production]
        serverTime:
          type: string
          format: date-time
          description: Hora del servidor en UTC (ISO-8601).
    Role:
      type: string
      enum: [user, admin]
    User:
      type: object
      description: La cuenta propia (solo la ve su dueña).
      required: [id, email, displayName, phone, role, ratingAverage, ratingCount, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        phone:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/Role'
        ratingAverage:
          type: [number, 'null']
          description: Promedio de calificaciones (1 a 5); null sin calificaciones (spec 010).
        ratingCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    PublicUser:
      type: object
      description: Perfil público; nunca incluye correo ni teléfono (Art. VI.4).
      required: [id, displayName, ratingAverage, ratingCount, memberSince]
      properties:
        id:
          type: string
        displayName:
          type: string
          description: «Cuenta eliminada» si la cuenta se dio de baja.
        ratingAverage:
          type: [number, 'null']
        ratingCount:
          type: integer
          minimum: 0
        memberSince:
          type: string
          format: date-time
    Tokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
          description: "JWT HS256 para el encabezado `Authorization: Bearer`."
        refreshToken:
          type: string
          description: Token opaco de un solo uso (30 días); se cambia en cada `refresh`.
        expiresIn:
          type: integer
          description: Segundos de vida del token de acceso (900).
    AuthResult:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/Tokens'
    RegisterRequest:
      type: object
      required: [email, password, displayName, acceptTerms, isAdult]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Se guarda en minúsculas y sin espacios.
        password:
          type: string
          minLength: 8
          maxLength: 72
        displayName:
          type: string
          minLength: 2
          maxLength: 40
        acceptTerms:
          type: boolean
          const: true
          description: Aceptación de términos y privacidad (POL-12).
        isAdult:
          type: boolean
          const: true
          description: Declaración de mayoría de edad (POL-12).
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 72
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          maxLength: 128
    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 40
        phone:
          type: [string, 'null']
          pattern: '^\+?[0-9]{10,15}$'
          description: 10 a 15 dígitos, con `+` opcional; null lo borra.
    DeleteMeRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          maxLength: 72
    ImagePurpose:
      type: string
      enum: [item_photo, evidence]
      description: item_photo es pública; evidence es privada (solo las partes de la reserva).
    UploadSignatureRequest:
      type: object
      required: [purpose]
      properties:
        purpose:
          $ref: '#/components/schemas/ImagePurpose'
    UploadSignature:
      type: object
      description: Datos para subir una imagen directo a Cloudinary (RF-01). Nunca incluye el API secret.
      required: [uploadUrl, apiKey, timestamp, signature, publicId, type, allowedFormats, overwrite]
      properties:
        uploadUrl:
          type: string
          format: uri
        apiKey:
          type: string
          description: API key pública de Cloudinary (no es secreta).
        timestamp:
          type: integer
          description: Segundos Unix; Cloudinary rechaza firmas de más de 1 h.
        signature:
          type: string
          description: SHA-256 en hexadecimal de los parámetros firmados.
        publicId:
          type: string
          description: '<carpeta base>/<purpose>/<userId>/<id>; enviarlo sin cambios como public_id.'
        type:
          type: string
          enum: [upload, authenticated]
        allowedFormats:
          type: string
          const: jpg,jpeg,png,webp
        overwrite:
          type: string
          const: 'false'
          description: Va firmado; impide volver a subir encima de una imagen ya verificada.
    ImageInput:
      type: object
      description: Referencia a una imagen ya subida, que reciben las demás rutas (RF-05). Máximo 5 por recurso.
      required: [publicId]
      properties:
        publicId:
          type: string
          maxLength: 255
    Image:
      type: object
      description: |
        Imagen verificada con Cloudinary (RF-06, RF-07). Las URL se calculan al
        leer; las de entrega authenticated caducan a los 10 minutos.
      required: [publicId, width, height, format, bytes, delivery, url, thumbUrl]
      properties:
        publicId:
          type: string
        width:
          type: integer
        height:
          type: integer
        format:
          type: string
          enum: [jpg, jpeg, png, webp]
        bytes:
          type: integer
          maximum: 5242880
        delivery:
          type: string
          enum: [public, authenticated]
        url:
          type: string
          format: uri
        thumbUrl:
          type: string
          format: uri
    ErrorCode:
      type: string
      description: Códigos permitidos por el Art. IV.3 de la constitución.
      enum:
        - validation_failed
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - rate_limited
        - internal_error
        - service_unavailable
    ErrorDetail:
      type: object
      required: [field, issue]
      properties:
        field:
          type: string
        issue:
          type: string
    Error:
      type: object
      description: Envoltorio único de errores (Art. IV.3).
      examples:
        - error:
            code: validation_failed
            message: Revisa los datos marcados.
            details:
              - field: email
                issue: formato inválido
            requestId: 43d4c7dbb802d8b3711c8f4163ffc823
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Texto legible en español (es-MX).
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            requestId:
              type: string
  responses:
    ValidationFailed:
      description: Datos inválidos; `details` indica cada campo.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_failed
              message: Revisa los datos marcados.
              details:
                - field: email
                  issue: formato inválido
              requestId: 43d4c7dbb802d8b3711c8f4163ffc823
    Unauthorized:
      description: Falta el token, es inválido o venció; también un refreshToken inválido o reutilizado.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Tu sesión no es válida o venció. Inicia sesión de nuevo.
              requestId: 43d4c7dbb802d8b3711c8f4163ffc823
    ServiceUnavailable:
      description: Una dependencia obligatoria (MongoDB) no responde.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: service_unavailable
              message: El servicio no está disponible por ahora. Intenta de nuevo en unos minutos.
              requestId: 43d4c7dbb802d8b3711c8f4163ffc823
    MethodNotAllowed:
      description: Método no permitido para la ruta; usa el código not_found.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Este método no está permitido para esta ruta.
              requestId: 43d4c7dbb802d8b3711c8f4163ffc823
    RateLimited:
      description: Se superó el límite de peticiones por IP o por usuario (Art. XIV.2).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          description: Segundos que conviene esperar antes de reintentar.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limited
              message: Hiciste demasiadas solicitudes. Espera un momento e intenta de nuevo.
              requestId: 43d4c7dbb802d8b3711c8f4163ffc823
    InternalError:
      description: Fallo inesperado; nunca expone detalles internos.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: Ocurrió un error inesperado. Intenta de nuevo.
              requestId: 43d4c7dbb802d8b3711c8f4163ffc823
