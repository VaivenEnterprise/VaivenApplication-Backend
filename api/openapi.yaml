            code: validation_failed
            message: Revisa los datos marcados.
            details:
              - field: email
                issue: formato inválido
            requestId: 43d4c7dbb802d8b3711c8f4163ffc823
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
