        photos:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Image'
        evidenceVersion:
          type: integer
          description: 0 sin evidencia; sube al reemplazarla.
        qr:
          type: object
          required: [state, expiresAt]
          properties:
            state:
              type: string
              enum: [none, active, expired, used]
            expiresAt:
              type: [string, 'null']
              format: date-time
              description: Solo con QR activo o vencido.
