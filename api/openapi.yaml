openapi: 3.1.0
info:
  title: VAIVÉN API
  version: 0.10.0
  summary: API REST del backend de VAIVÉN (préstamo y renta de objetos en México).
  description: |
    Contrato de la spec 002 (arquitectura base): endpoints de infraestructura y
    el envoltorio único de errores (Art. IV de la constitución). La spec 003
    agrega la cuenta y la autenticación (`api/paths/auth.yaml` y `users.yaml`) y
    la spec 004 las imágenes (`api/paths/uploads.yaml`) y la spec 005 los objetos
    (`api/paths/items.yaml`); la spec 006 la búsqueda (`api/paths/search.yaml`) y la
    spec 007 las solicitudes y reservas (`api/paths/bookings.yaml`) y la spec
    008 el chat privado (`api/paths/chat.yaml`) y la spec 009 la entrega, la
    devolución y los pagos (`api/paths/handover.yaml` y `payments.yaml`) y la spec
    010 las calificaciones, las incidencias y la administración
    (`api/paths/ratings.yaml`, `incidents.yaml` y `admin.yaml`).

    - Rutas de negocio bajo `/api/v1`; `/healthz` y `/readyz` fuera del prefijo.
    - JSON en `camelCase`; fechas en ISO-8601 UTC.
    - Toda respuesta trae `X-Request-Id`: si la petición envía uno válido
      (≤ 64 caracteres alfanuméricos y guiones) se reutiliza; si no, se genera.
    - Las specs siguientes agregan sus rutas en `api/paths/<modulo>.yaml`.
    - Autenticación (spec 003): `Authorization: Bearer <accessToken>` (JWT de
      15 min). Las rutas sin autenticación declaran `security: []`.
security:
  - bearerAuth: []
servers:
  - url: https://vaiven-staging.westus2.cloudapp.azure.com:8443
    description: Staging (Azure)
  - url: http://localhost:8080
    description: Desarrollo local
tags:
  - name: infraestructura
    description: Salud del proceso y de sus dependencias.
  - name: meta
    description: Información del servicio para el cliente móvil.
  - name: auth
    description: Registro, inicio de sesión y tokens (spec 003).
  - name: cuenta
    description: La cuenta de la persona autenticada (spec 003).
  - name: usuarios
    description: Perfiles públicos (spec 003).
  - name: imagenes
    description: Subida de imágenes a Cloudinary con firma del servidor (spec 004).
  - name: objetos
    description: Publicar, editar y pausar objetos; precio sugerido y categorías (spec 005).
  - name: busqueda
    description: Buscar objetos por texto, categoría, zona, cercanía y fechas (spec 006).
  - name: reservas
    description: Cotizar, solicitar, aceptar, rechazar y cancelar reservas (spec 007).
  - name: chat
    description: Conversación privada de texto de cada reserva (spec 008).
  - name: entrega
    description: Evidencia, QR de un solo uso y confirmación de la entrega y la devolución (spec 009).
  - name: pagos
    description: Reporte y confirmación del pago acordado, sin cobro (spec 009).
  - name: calificaciones
    description: Calificar a la otra parte de una reserva completada y ver las recibidas (spec 010).
  - name: incidencias
    description: Reportar un incumplimiento con evidencia y consultarlo (spec 010).
  - name: administracion
    description: Revisión de incidencias y sanciones; exige rol `admin` (spec 010).
paths:
  /healthz:
    get:
      tags: [infraestructura]
      operationId: getHealthz
      security: []
      summary: El proceso está vivo
      description: Responde 200 mientras el proceso vive; no consulta dependencias.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: El proceso está vivo.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
              example:
                status: ok
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /readyz:
    get:
      tags: [infraestructura]
      operationId: getReadyz
      security: []
      summary: El servicio puede atender peticiones
      description: |
        Hace ping a MongoDB (máximo 2 s). Responde 503 `service_unavailable` solo si
        MongoDB no responde. Redis nunca es fuente de verdad: si falla, responde 200
        con `redis: degradado` (Art. XIV.2).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: MongoDB responde.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
              example:
                status: ready
                redis: ok
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/meta:
    get:
      tags: [meta]
      operationId: getMeta
      security: []
      summary: Información del servicio
      description: Permite al móvil comprobar conectividad y versión.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Datos del servicio.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
              example:
                name: vaiven-backend
                version: 0.2.0
                environment: staging
                serverTime: '2026-11-07T15:00:00Z'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/register:
    $ref: './paths/auth.yaml#/register'
  /api/v1/auth/login:
    $ref: './paths/auth.yaml#/login'
  /api/v1/auth/refresh:
    $ref: './paths/auth.yaml#/refresh'
  /api/v1/auth/logout:
    $ref: './paths/auth.yaml#/logout'
  /api/v1/me:
    $ref: './paths/auth.yaml#/me'
  /api/v1/users/{id}:
    $ref: './paths/users.yaml#/userById'
  /api/v1/uploads/signature:
    $ref: './paths/uploads.yaml#/signature'
  /api/v1/items:
    # GET (búsqueda, 006) y POST (publicar, 005) comparten la ruta.
    $ref: './paths/search.yaml#/items'
  /api/v1/items/price-suggestion:
    $ref: './paths/items.yaml#/priceSuggestion'
  /api/v1/items/{id}:
    $ref: './paths/items.yaml#/itemById'
  /api/v1/items/{id}/pause:
    $ref: './paths/items.yaml#/pauseItem'
  /api/v1/items/{id}/resume:
    $ref: './paths/items.yaml#/resumeItem'
  /api/v1/me/items:
    $ref: './paths/items.yaml#/myItems'
  /api/v1/categories:
    $ref: './paths/items.yaml#/categories'
  /api/v1/items/{id}/quote:
    $ref: './paths/bookings.yaml#/quote'
  /api/v1/bookings:
    $ref: './paths/bookings.yaml#/bookings'
  /api/v1/bookings/{id}:
    $ref: './paths/bookings.yaml#/bookingById'
  /api/v1/me/bookings:
    $ref: './paths/bookings.yaml#/myBookings'
  /api/v1/bookings/{id}/accept:
    $ref: './paths/bookings.yaml#/accept'
  /api/v1/bookings/{id}/reject:
    $ref: './paths/bookings.yaml#/reject'
  /api/v1/bookings/{id}/cancel:
    $ref: './paths/bookings.yaml#/cancel'
  /api/v1/bookings/{id}/meeting-point:
    $ref: './paths/bookings.yaml#/meetingPoint'
  /api/v1/conversations:
    $ref: './paths/chat.yaml#/conversations'
  /api/v1/conversations/unread-count:
    $ref: './paths/chat.yaml#/unreadCount'
  /api/v1/conversations/{id}/messages:
    $ref: './paths/chat.yaml#/messages'
  /api/v1/conversations/{id}/read:
    $ref: './paths/chat.yaml#/read'
  /api/v1/bookings/{id}/delivery/evidence:
    $ref: './paths/handover.yaml#/deliveryEvidence'
  /api/v1/bookings/{id}/delivery/qr:
    $ref: './paths/handover.yaml#/deliveryQr'
  /api/v1/bookings/{id}/delivery/confirm:
    $ref: './paths/handover.yaml#/deliveryConfirm'
  /api/v1/bookings/{id}/delivery:
    $ref: './paths/handover.yaml#/deliveryStage'
  /api/v1/bookings/{id}/return/evidence:
    $ref: './paths/handover.yaml#/returnEvidence'
  /api/v1/bookings/{id}/return/qr:
    $ref: './paths/handover.yaml#/returnQr'
  /api/v1/bookings/{id}/return/confirm:
    $ref: './paths/handover.yaml#/returnConfirm'
  /api/v1/bookings/{id}/return:
    $ref: './paths/handover.yaml#/returnStage'
  /api/v1/bookings/{id}/payments/{stage}/report:
    $ref: './paths/payments.yaml#/paymentReport'
  /api/v1/bookings/{id}/payments/{stage}/confirm:
    $ref: './paths/payments.yaml#/paymentConfirm'
  /api/v1/bookings/{id}/ratings:
    $ref: './paths/ratings.yaml#/bookingRatings'
  /api/v1/bookings/{id}/rating-status:
    $ref: './paths/ratings.yaml#/ratingStatus'
  /api/v1/users/{id}/ratings:
    $ref: './paths/ratings.yaml#/userRatings'
  /api/v1/bookings/{id}/incidents:
    $ref: './paths/incidents.yaml#/bookingIncidents'
  /api/v1/incidents/{id}:
    $ref: './paths/incidents.yaml#/incidentById'
  /api/v1/me/incidents:
    $ref: './paths/incidents.yaml#/myIncidents'
  /api/v1/admin/incidents:
    $ref: './paths/admin.yaml#/adminIncidents'
  /api/v1/admin/incidents/{id}/notes:
    $ref: './paths/admin.yaml#/adminIncidentNotes'
  /api/v1/admin/incidents/{id}/close:
    $ref: './paths/admin.yaml#/adminIncidentClose'
  /api/v1/admin/users/{id}/sanctions:
    $ref: './paths/admin.yaml#/adminUserSanctions'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token de acceso que entregan login, register y refresh."
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "El mismo token de acceso, de una cuenta con rol `admin` (spec 010, RF-11). Las demás cuentas reciben 403."
  parameters:
    BookingIdPath:
      name: id
      in: path
      required: true
      description: Identificador de la reserva (24 caracteres hexadecimales).
      schema:
        type: string
        pattern: '^[0-9a-f]{24}$'
    UserIdPath:
      name: id
      in: path
      required: true
      description: Identificador de la persona (24 caracteres hexadecimales).
      schema:
        type: string
        pattern: '^[0-9a-f]{24}$'
    IncidentIdPath:
      name: id
      in: path
      required: true
      description: Identificador de la incidencia (24 caracteres hexadecimales).
      schema:
        type: string
        pattern: '^[0-9a-f]{24}$'
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: El `nextCursor` de la página anterior.
      schema:
        type: string
        maxLength: 128
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Tamaño de página.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Identificador de la petición; se reutiliza si es válido.
      schema:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9-]{1,64}$'
  headers:
    X-Request-Id:
      description: Identificador de la petición (el recibido si era válido o uno nuevo).
      schema:
        type: string
        maxLength: 64
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Ready:
      type: object
      required: [status, redis]
      properties:
        status:
          type: string
          enum: [ready]
        redis:
          type: string
          enum: [ok, degradado]
          description: Estado de Redis; degradado si no responde o no está configurado.
    Meta:
      type: object
      required: [name, version, environment, serverTime]
      properties:
        name:
          type: string
        version:
          type: string
        environment:
          type: string
          enum: [development, test, staging, production]
        serverTime:
          type: string
          format: date-time
          description: Hora del servidor en UTC (ISO-8601).
    Role:
      type: string
      enum: [user, admin]
    User:
      type: object
      description: La cuenta propia (solo la ve su dueña).
      required: [id, email, displayName, phone, role, ratingAverage, ratingCount, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        phone:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/Role'
        ratingAverage:
          type: [number, 'null']
          description: Promedio de calificaciones (1 a 5); null sin calificaciones (spec 010).
        ratingCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    PublicUser:
      type: object
      description: Perfil público; nunca incluye correo ni teléfono (Art. VI.4).
      required: [id, displayName, ratingAverage, ratingCount, memberSince]
      properties:
        id:
          type: string
        displayName:
          type: string
          description: «Cuenta eliminada» si la cuenta se dio de baja.
        ratingAverage:
          type: [number, 'null']
        ratingCount:
          type: integer
          minimum: 0
        memberSince:
          type: string
          format: date-time
    Tokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
          description: "JWT HS256 para el encabezado `Authorization: Bearer`."
        refreshToken:
          type: string
          description: Token opaco de un solo uso (30 días); se cambia en cada `refresh`.
        expiresIn:
          type: integer
          description: Segundos de vida del token de acceso (900).
    AuthResult:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/Tokens'
    RegisterRequest:
      type: object
      required: [email, password, displayName, acceptTerms, isAdult]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Se guarda en minúsculas y sin espacios.
        password:
          type: string
          minLength: 8
          maxLength: 72
        displayName:
          type: string
          minLength: 2
          maxLength: 40
        acceptTerms:
          type: boolean
          const: true
          description: Aceptación de términos y privacidad (POL-12).
        isAdult:
          type: boolean
          const: true
          description: Declaración de mayoría de edad (POL-12).
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 72
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          maxLength: 128
    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 40
        phone:
          type: [string, 'null']
          pattern: '^\+?[0-9]{10,15}$'
          description: 10 a 15 dígitos, con `+` opcional; null lo borra.
    DeleteMeRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          maxLength: 72
    ImagePurpose:
      type: string
      enum: [item_photo, evidence]
      description: item_photo es pública; evidence es privada (solo las partes de la reserva).
    UploadSignatureRequest:
      type: object
      required: [purpose]
      properties:
        purpose:
          $ref: '#/components/schemas/ImagePurpose'
    UploadSignature:
      type: object
      description: Datos para subir una imagen directo a Cloudinary (RF-01). Nunca incluye el API secret.
      required: [uploadUrl, apiKey, timestamp, signature, publicId, type, allowedFormats, overwrite]
      properties:
        uploadUrl:
          type: string
          format: uri
        apiKey:
          type: string
          description: API key pública de Cloudinary (no es secreta).
        timestamp:
          type: integer
          description: Segundos Unix; Cloudinary rechaza firmas de más de 1 h.
        signature:
          type: string
          description: SHA-256 en hexadecimal de los parámetros firmados.
        publicId:
          type: string
          description: '<carpeta base>/<purpose>/<userId>/<id>; enviarlo sin cambios como public_id.'
        type:
          type: string
          enum: [upload, authenticated]
        allowedFormats:
          type: string
          const: jpg,jpeg,png,webp
        overwrite:
          type: string
          const: 'false'
          description: Va firmado; impide volver a subir encima de una imagen ya verificada.
    ImageInput:
      type: object
      description: Referencia a una imagen ya subida, que reciben las demás rutas (RF-05). Máximo 5 por recurso.
      required: [publicId]
      properties:
        publicId:
          type: string
          maxLength: 255
    Image:
      type: object
      description: |
        Imagen verificada con Cloudinary (RF-06, RF-07). Las URL se calculan al
        leer; las de entrega authenticated caducan a los 10 minutos.
      required: [publicId, width, height, format, bytes, delivery, url, thumbUrl]
      properties:
        publicId:
          type: string
        width:
          type: integer
        height:
          type: integer
        format:
          type: string
          enum: [jpg, jpeg, png, webp]
        bytes:
          type: integer
          maximum: 5242880
        delivery:
          type: string
          enum: [public, authenticated]
        url:
          type: string
          format: uri
        thumbUrl:
          type: string
          format: uri
    CategoryKey:
      type: string
      description: Categorías de POL-14.
      enum: [herramientas_manuales, herramientas_electricas, construccion_jardineria, movilidad, deportes, hogar, otros]
    Category:
      type: object
      required: [key, label]
      properties:
        key:
          $ref: '#/components/schemas/CategoryKey'
        label:
          type: string
    ItemCondition:
      type: string
      enum: [new, like_new, good, fair, worn]
    ItemModality:
      type: string
      enum: [loan, rent]
      description: loan = préstamo gratuito; rent = renta por día.
    PriceSource:
      type: string
      enum: [manual, suggested]
    ItemStatus:
      type: string
      enum: [active, paused, blocked]
      description: blocked lo pone moderación (spec 011). Los objetos eliminados nunca se devuelven.
    Zone:
      type: object
      required: [municipality]
      properties:
        municipality:
          type: string
          minLength: 2
          maxLength: 60
        neighborhood:
          type: [string, 'null']
          maxLength: 60
    ApproxLocation:
      type: object
      description: Ubicación aproximada; el servidor la redondea a 2 decimales (~1 km, RF-04).
      required: [lat, lng]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    ItemInput:
      type: object
      required: [title, description, category, condition, modality, declaredValueCents, pricePerDayCents, priceSource, zone, photos]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 80
        description:
          type: string
          maxLength: 1000
        category:
          $ref: '#/components/schemas/CategoryKey'
        condition:
          $ref: '#/components/schemas/ItemCondition'
        modality:
          $ref: '#/components/schemas/ItemModality'
        declaredValueCents:
          type: integer
          minimum: 5000
          maximum: 10000000
          description: Valor declarado en centavos ($50 a $100,000). Solo lo ven el dueño y admin.
        pricePerDayCents:
          type: integer
          minimum: 0
          description: 0 en préstamo; en renta de 1000 ($10) al valor declarado.
        priceSource:
          $ref: '#/components/schemas/PriceSource'
        usageRules:
          type: [string, 'null']
          maxLength: 500
        zone:
          $ref: '#/components/schemas/Zone'
        approxLocation:
          oneOf:
            - $ref: '#/components/schemas/ApproxLocation'
            - type: 'null'
        photos:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/ImageInput'
    ItemUpdate:
      type: object
      description: Campos a cambiar más la versión leída (control optimista). Al menos un campo además de version.
      required: [version]
      minProperties: 2
      properties:
        version:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 3
          maxLength: 80
        description:
          type: string
          maxLength: 1000
        category:
          $ref: '#/components/schemas/CategoryKey'
        condition:
          $ref: '#/components/schemas/ItemCondition'
        modality:
          $ref: '#/components/schemas/ItemModality'
        declaredValueCents:
          type: integer
          minimum: 5000
          maximum: 10000000
          description: Valor declarado en centavos ($50 a $100,000). Solo lo ven el dueño y admin.
        pricePerDayCents:
          type: integer
          minimum: 0
          description: 0 en préstamo; en renta de 1000 ($10) al valor declarado.
        priceSource:
          $ref: '#/components/schemas/PriceSource'
        usageRules:
          type: [string, 'null']
          maxLength: 500
        zone:
          $ref: '#/components/schemas/Zone'
        approxLocation:
          oneOf:
            - $ref: '#/components/schemas/ApproxLocation'
            - type: 'null'
        photos:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/ImageInput'
    Item:
      type: object
      required: [id, owner, title, description, category, condition, modality, declaredValueCents, pricePerDayCents, priceSource, usageRules, zone, approxLocation, photos, status, createdAt, updatedAt, version]
      properties:
        id:
          type: string
        owner:
          $ref: '#/components/schemas/PublicUser'
        title:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/CategoryKey'
        condition:
          $ref: '#/components/schemas/ItemCondition'
        modality:
          $ref: '#/components/schemas/ItemModality'
        declaredValueCents:
          type: [integer, 'null']
          description: null si quien consulta no es el dueño ni admin.
        pricePerDayCents:
          type: integer
        priceSource:
          $ref: '#/components/schemas/PriceSource'
        usageRules:
          type: [string, 'null']
        zone:
          $ref: '#/components/schemas/Zone'
        approxLocation:
          oneOf:
            - $ref: '#/components/schemas/ApproxLocation'
            - type: 'null'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        status:
          $ref: '#/components/schemas/ItemStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
      example:
        id: 6731a2b3c4d5e6f7a8b9c0d1
        owner:
          id: 6730f1c2a9b3e4d5f6a7b8c9
          displayName: Ana
          ratingAverage: null
          ratingCount: 0
          memberSince: '2026-11-06T18:00:00Z'
        title: Taladro percutor 600 W
