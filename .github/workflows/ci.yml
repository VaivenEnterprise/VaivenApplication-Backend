name: CI

on:
  pull_request:
    branches: [develop, main, 'spec/**']
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [develop, main, 'spec/**']
  workflow_dispatch:
    inputs:
      runner:
        description: Imagen de runner para probar (24.04 es la del pipeline)
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-26.04
  schedule:
    - cron: '17 12 * * 1'

permissions:
  contents: read

# Concurrencia (ver docs/devsecops.md):
# - pull_request: un grupo por PR; un push nuevo al PR cancela la ejecucion vieja.
# - push a develop/main/spec/**: nunca se cancela. El grupo lleva el SHA porque,
#   sin cancelar, GitHub deja solo UNA ejecucion pendiente por grupo y la nueva
#   reemplaza (cancela) a la pendiente: con tres pushes seguidos el del medio
#   quedaria sin validar. Con el SHA cada commit tiene su grupo y siempre corre.
# - workflow_dispatch: grupo por ejecucion (run_id), para comparar runners en paralelo.
# - schedule: su propio grupo por rama, sin cancelar.
concurrency:
  group: >-
    ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}${{
    github.event_name == 'push' && format('-{0}', github.sha) ||
    github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runners: imagen fija (ubuntu-24.04), no ubuntu-latest. En push/PR/schedule
# `inputs` esta vacio y se usa 24.04; para probar 26.04 se lanza a mano
# (Actions > CI > Run workflow > runner). Quality necesita Docker (pruebas de
# integracion con testcontainers) y gcc para cgo (go test -race): ambos vienen
# en la imagen ubuntu-24.04 de GitHub.
jobs:
  policy:
    name: Policy
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --test .github/scripts/policy.test.mjs .github/scripts/project.test.mjs
      - run: node .github/scripts/policy.mjs

  quality:
    name: Quality
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.project.outputs.ready }}
      mode: ${{ steps.project.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: hashFiles('go.mod') != ''
        with:
          go-version-file: go.mod
          cache: false
      - id: project
        run: node .github/scripts/project.mjs Backend
      - name: Validate Go module without code
        if: steps.project.outputs.mode == 'module'
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go mod tidy -diff
          echo 'Modulo Go validado: go mod download, verify y tidy -diff sin cambios (go.sum no es obligatorio sin dependencias).' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Format, vet, tests, integration and build
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          go mod download
          go mod verify
          go vet ./...
          go test -race -covermode=atomic -coverprofile=coverage.out ./...
          node .github/scripts/coverage.mjs go
          go test -race -tags=integration ./...
          go build ./...
      - name: OpenAPI bundle al día
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Swagger UI (/docs) embebe una copia empaquetada de api/: debe coincidir.
          npx --yes @redocly/cli@1.34.5 bundle api/openapi.yaml -o "$RUNNER_TEMP/openapi.yaml"
          if ! diff -u internal/adapter/http/docs/openapi.yaml "$RUNNER_TEMP/openapi.yaml"; then
            echo '::error::internal/adapter/http/docs/openapi.yaml está desfasado de api/. Ejecuta make docs-bundle y sube el resultado.'
            exit 1
          fi
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: steps.project.outputs.ready == 'true'
        with:
          version: v2.15.0
      - name: Go vulnerability analysis
        if: steps.project.outputs.ready == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  secrets:
    name: Secrets
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          tool_dir=$(mktemp -d)
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tool_dir/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$tool_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan all reachable history and working tree
        run: |
          gitleaks git --redact --no-banner --log-opts="--all --no-textconv"
          gitleaks dir --redact --no-banner .

  sast:
    name: CodeQL
    needs: quality
    if: needs.quality.outputs.ready == 'true'
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:go
          output: codeql-results
      - name: Block high and critical findings
        run: node .github/scripts/check-sarif.mjs

  gate:
    name: Required checks
    if: always()
    needs: [policy, quality, secrets, sast]
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Enforce all results
        env:
          POLICY: ${{ needs.policy.result }}
          QUALITY: ${{ needs.quality.result }}
          SECRETS: ${{ needs.secrets.result }}
          SAST: ${{ needs.sast.result }}
          READY: ${{ needs.quality.outputs.ready }}
          MODE: ${{ needs.quality.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          test "$POLICY" = success
          test "$QUALITY" = success
          test "$SECRETS" = success
          case "$MODE" in
            full)
              test "$READY" = true
              test "$SAST" = success
              ;;
            module|docs)
              test "$READY" = false
              test "$SAST" = skipped
              ;;
            *)
              echo "Modo de Quality no reconocido: '$MODE'" >&2
              exit 1
              ;;
          esac
